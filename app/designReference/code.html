<!DOCTYPE html>

<html class="dark" lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "error": "#ffb4ab",
              "on-primary-fixed": "#370e00",
              "on-error": "#690005",
              "secondary-container": "#454747",
              "tertiary-fixed": "#d7e7d6",
              "secondary-fixed-dim": "#c6c6c7",
              "on-secondary-fixed-variant": "#454747",
              "surface-container-high": "#013124",
              "inverse-surface": "#bfecd9",
              "surface-variant": "#0f3c2f",
              "surface": "#001710",
              "secondary": "#c6c6c7",
              "on-tertiary-fixed": "#121e14",
              "on-secondary-container": "#b4b5b5",
              "on-surface-variant": "#c0c8c3",
              "inverse-primary": "#a63b00",
              "inverse-on-surface": "#09372b",
              "tertiary-fixed-dim": "#bbcbba",
              "on-secondary": "#2f3131",
              "on-error-container": "#ffdad6",
              "primary-fixed-dim": "#ffb599",
              "on-tertiary": "#263428",
              "primary-container": "#601e00",
              "tertiary": "#bbcbba",
              "on-primary-container": "#f9763d",
              "surface-dim": "#001710",
              "surface-container-highest": "#0f3c2f",
              "on-tertiary-container": "#91a091",
              "primary-fixed": "#ffdbce",
              "secondary-fixed": "#e2e2e2",
              "surface-container-lowest": "#00120b",
              "on-primary": "#5a1c00",
              "background": "#001710",
              "on-secondary-fixed": "#1a1c1c",
              "error-container": "#93000a",
              "outline": "#8a938e",
              "surface-container-low": "#002117",
              "on-surface": "#bfecd9",
              "outline-variant": "#414845",
              "on-background": "#bfecd9",
              "primary": "#ffb599",
              "on-primary-fixed-variant": "#7f2b00",
              "surface-tint": "#ffb599",
              "on-tertiary-fixed-variant": "#3c4a3e",
              "surface-container": "#00251b",
              "tertiary-container": "#2a372c",
              "surface-bright": "#154033"
            },
            fontFamily: {
              "headline": ["Space Grotesk"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-card {
            background: rgba(15, 60, 47, 0.6);
            backdrop-filter: blur(16px);
        }
        .clay-gradient {
            background: linear-gradient(135deg, #ffb599 0%, #601e00 100%);
        }
        .radar-grid {
            clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);
        }
    </style>
<style>
        body {
          min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-surface text-on-surface font-body min-h-screen selection:bg-primary selection:text-on-primary">
<!-- TopAppBar -->
<header class="fixed top-0 z-50 w-full bg-[#001710] flex items-center justify-between px-6 py-4 shadow-[0_24px_40px_rgba(191,236,217,0.06)]">
<div class="flex items-center gap-4">
<button class="text-[#ffb599] hover:bg-[#0f3c2f] transition-colors active:scale-95 duration-150 p-1">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-space-grotesk font-bold text-2xl tracking-tight text-[#ffb599]">Player Stats</h1>
</div>
<div class="text-[#ffb599] font-black uppercase tracking-tighter">
        DIAMOND EDITORIAL
    </div>
</header>
<main class="pt-24 pb-32 px-6 max-w-md mx-auto">
<!-- Player Hero Section -->
<section class="mb-12 relative overflow-hidden rounded-xl bg-surface-container-low p-6">
<div class="flex flex-col gap-1 mb-6">
<span class="font-headline font-bold text-primary tracking-widest text-4xl">32</span>
<h2 class="font-headline font-extrabold text-on-surface text-5xl tracking-tight leading-none uppercase">Choi<br/>Hyun-seok</h2>
<div class="mt-4 flex flex-wrap gap-2">
<span class="bg-surface-container-highest text-primary font-bold px-3 py-1 rounded-sm text-xs tracking-tighter border-b-2 border-primary">TEAM A</span>
<span class="bg-surface-container-high text-on-surface-variant font-medium px-3 py-1 rounded-sm text-xs tracking-tighter">C, 3B, 1B - C</span>
</div>
</div>
<div class="absolute -right-12 -top-12 w-64 h-64 opacity-10 pointer-events-none">
<img alt="" class="w-full h-full object-contain" data-alt="Stylized baseball stitching pattern in a subtle deep green monochromatic color scheme" src="https://lh3.googleusercontent.com/aida-public/AB6AXuClHp17opjzTAzovvQDJEj7LRSXoyKnqyF-4t9Bc4nIJZSH7YpAeT5pmuLuHbLO-h7tPpv1-f0SL0lIXl8M4hljD4ISLJ6kg6HTvt_-vG17w1y4KNHl45z5KoC9lLFMRVIvz2x4lHz9k96O0lOTz_ljIjm6CT_P-WK35LkyR--H_LPH7tmSr6ZnaAH58AaO7wGfO5487jSt9klKZiaJk6gDdiZQOnwvX8TPEjHDAgkA1IMsTjkceG8ZeJeRWnV79WROR6o6J3l8YIg"/>
</div>
</section>
<!-- Radar Chart Section -->
<section class="mb-10">
<div class="flex items-end justify-between mb-8">
<h3 class="font-headline font-bold text-2xl text-on-surface leading-none">Visual Analysis</h3>
<span class="text-[0.6875rem] font-medium uppercase tracking-[0.2em] text-on-surface-variant">Performance Profile</span>
</div>
<div class="glass-card rounded-3xl p-8 flex items-center justify-center relative aspect-square">
<!-- Radar Background -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none">
<div class="w-4/5 h-4/5 border border-on-surface/10 radar-grid"></div>
<div class="absolute w-3/5 h-3/5 border border-on-surface/10 radar-grid"></div>
<div class="absolute w-2/5 h-2/5 border border-on-surface/10 radar-grid"></div>
</div>
<!-- Radar Data Shape -->
<div class="absolute inset-0 flex items-center justify-center p-12">
<svg class="w-full h-full overflow-visible drop-shadow-[0_0_15px_rgba(255,181,153,0.3)]" viewbox="0 0 100 100">
<polygon fill="rgba(255,181,153,0.25)" points="50,10 90,40 70,85 30,80 15,35" stroke="#ffb599" stroke-width="2"></polygon>
</svg>
</div>
<!-- Radar Labels -->
<div class="absolute top-4 left-1/2 -translate-x-1/2 font-label text-[0.6875rem] font-bold text-on-surface tracking-widest uppercase bg-surface px-2">Stamina</div>
<div class="absolute top-1/3 -right-2 font-label text-[0.6875rem] font-bold text-on-surface tracking-widest uppercase bg-surface px-2">Speed</div>
<div class="absolute bottom-4 right-8 font-label text-[0.6875rem] font-bold text-on-surface tracking-widest uppercase bg-surface px-2">Power</div>
<div class="absolute bottom-4 left-8 font-label text-[0.6875rem] font-bold text-on-surface tracking-widest uppercase bg-surface px-2">Contact</div>
<div class="absolute top-1/3 -left-2 font-label text-[0.6875rem] font-bold text-on-surface tracking-widest uppercase bg-surface px-2">Defense</div>
</div>
</section>
<!-- Asymmetric Stat Grid (Moved below Visual Analysis) -->
<div class="grid grid-cols-2 gap-4 mb-10">
<div class="surface-container-high rounded-xl p-5 flex flex-col justify-between h-40">
<span class="text-on-surface-variant text-[0.6875rem] font-medium uppercase tracking-widest">도루 (Steals)</span>
<div>
<span class="font-headline font-bold text-5xl text-on-surface">90</span>
<div class="h-1 w-8 bg-primary mt-2"></div>
</div>
</div>
<div class="surface-container rounded-xl p-5 flex flex-col justify-between h-40 border-l-2 border-primary-container">
<span class="text-on-surface-variant text-[0.6875rem] font-medium uppercase tracking-widest">구속 (Pitch Speed)</span>
<div>
<div class="flex items-baseline gap-1">
<span class="font-headline font-bold text-5xl text-on-surface">100</span>
<span class="font-label text-sm text-primary font-bold">km/h</span>
</div>
</div>
</div>
</div>
<!-- Action Section -->
<div class="mt-12 space-y-4">
<button class="w-full py-4 rounded-md border border-outline-variant/30 text-on-surface font-medium hover:bg-surface-container-highest transition-colors active:scale-95 flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-lg">arrow_back</span>
<span>뒤로가기</span>
</button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 rounded-t-xl bg-[#001710]/95 backdrop-blur-xl border-t border-[#bfecd9]/15 flex justify-around items-center h-20 px-4 pb-safe shadow-2xl">
<div class="flex flex-col items-center justify-center gap-1 text-[#ffb599] bg-[#601e00]/20 rounded-xl px-3 py-1 active:scale-90 transition-transform">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">sports_baseball</span>
<span class="font-inter text-[0.6875rem] font-medium uppercase tracking-widest text-[#ffb599]">Matches</span>
</div>
<div class="flex flex-col items-center justify-center gap-1 text-[#bfecd9]/60 hover:text-[#ffb599] active:scale-90 transition-transform">
<span class="material-symbols-outlined">groups</span>
<span class="font-inter text-[0.6875rem] font-medium uppercase tracking-widest">Team</span>
</div>
<div class="flex flex-col items-center justify-center gap-1 text-[#bfecd9]/60 hover:text-[#ffb599] active:scale-90 transition-transform">
<span class="material-symbols-outlined">emoji_events</span>
<span class="font-inter text-[0.6875rem] font-medium uppercase tracking-widest">League</span>
</div>
<div class="flex flex-col items-center justify-center gap-1 text-[#bfecd9]/60 hover:text-[#ffb599] active:scale-90 transition-transform">
<span class="material-symbols-outlined">person</span>
<span class="font-inter text-[0.6875rem] font-medium uppercase tracking-widest">Profile</span>
</div>
</nav>
</body></html>
